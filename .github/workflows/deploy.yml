name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One Pages deployment at a time. A newer push cancels the in-flight
# run so deploys do not pile up on the Pages lock or a stuck CDN purge.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify index.html
        run: ls -lh index.html *.html 2>/dev/null || echo "No HTML files found"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
